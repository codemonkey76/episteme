# Every push to main that touches the mobile app builds a release APK and
# ships it to Firebase App Distribution so it lands on test devices.
#
# Secrets:
#   FIREBASE_APP_ID          — App Distribution app id (1:…:android:…)
#   FIREBASE_SERVICE_ACCOUNT — service-account JSON with App Distribution access
name: Mobile — Firebase App Distribution

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-distribute.yml'

jobs:
  distribute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # The run number becomes the build number and the version-name patch
      # digit, so every upload shows as a distinct version in App Distribution
      # (e.g. 1.0.3, 1.0.4, …).
      - run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: mobile/build/app/outputs/flutter-apk/app-release.apk
          # Group alias from Firebase console → App Distribution → Testers &
          # Groups (shown under the group name) — members manage themselves
          # there, no workflow edits needed to add a device.
          groups: testers
          releaseNotes: ${{ github.event.head_commit.message }}
