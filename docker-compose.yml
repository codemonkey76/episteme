services:
  episteme:
    build: .
    expose:
      - "3000"
    volumes:
      - episteme_data:/data
      # Host folder exposed to filesystem MCP servers at /data/shared.
      # Set EPISTEME_SHARED_DIR in .env; defaults to ./shared next to this
      # file. Keep it narrow — everything under it is readable by the AI.
      - "${EPISTEME_SHARED_DIR:-./shared}:/data/shared:ro"
    environment:
      BIND: "0.0.0.0:3000"
      DATA_DIR: /data
      STATIC_DIR: /app/static
      RUST_LOG: "episteme=info,tower_http=info"
      # The agent's web_search tool queries the SearXNG sidecar below.
      SEARXNG_URL: "http://searxng:8080"
      # Voice notes transcribe against the Whisper sidecar below; override
      # WHISPER_MODEL in .env to trade accuracy for CPU (e.g.
      # deepdml/faster-whisper-large-v3-turbo-ct2 on a beefier box).
      WHISPER_URL: "http://whisper:8000"
    env_file:
      - path: .env
        required: false

  # Self-hosted metasearch for the agent's web_search tool. Internal-only:
  # reachable from the episteme container, never published through Caddy.
  # Copy searxng/settings.yml.example to searxng/settings.yml and set a real
  # secret_key before first start (see that file).
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw

  # Self-hosted speech-to-text for voice notes (OpenAI-compatible
  # /v1/audio/transcriptions). Internal-only, like SearXNG. The model
  # (WHISPER_MODEL on episteme) downloads from Hugging Face on first use and
  # is cached in the volume, so the first transcription is slow once.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EPISTEME_DOMAIN: "${EPISTEME_DOMAIN:?set EPISTEME_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - episteme

volumes:
  episteme_data:
  caddy_data:
  caddy_config:
  whisper_models:
