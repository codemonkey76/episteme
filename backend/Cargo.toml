[package]
name = "episteme"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "episteme"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server + SSE
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# Async utilities
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Authentication (password hashing + cookie expiry)
argon2 = "0.5"
time = "0.3"

# Model router
genai = "0.1"

# MCP host (official Rust SDK)
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for OAuth token exchange)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# URL building
url = "2"

# Config / env
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
