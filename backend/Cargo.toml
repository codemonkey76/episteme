[package]
name = "episteme"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "episteme"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server + SSE
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# Async utilities
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# Authentication (password hashing + cookie expiry)
argon2 = "0.5"
time = "0.3"

# Model router
genai = "0.1"

# MCP host (official Rust SDK)
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for OAuth token exchange)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# URL building
url = "2"
urlencoding = "2"

# Attachment payloads (Graph contentBytes / upload sessions)
base64 = "0.22"

# Config / env
dotenvy = "0.15"
pdf-extract = "0.10.0"
jsonwebtoken = "10.4.0"
web-push = { version = "0.11.0", default-features = false, features = ["hyper-client"] }
p256 = "0.13.2"
getrandom = "0.4.2"
totp-rs = { version = "5.7.1", features = ["gen_secret", "otpauth"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.11.0"

# Interactive terminals (PTY for the bash/PowerShell windows)
portable-pty = "0.8"
strip-ansi-escapes = "0.2"

[dev-dependencies]
tokio-test = "0.4"
